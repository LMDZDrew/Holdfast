// Holdfast core mod: server-owned combat rules (docs/core_combat.md). Forge 1.20.1 MDK layout, ForgeGradle 6.
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        // Automated server checks (docs/core_combat.md): ./gradlew runGameTestServer
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

// The exported character assets are shared with the test harness.
sourceSets.main.resources { srcDir '../art/characters/export' }

repositories {
    // Not exclusiveContent: ForgeGradle serves remapped copies of these coordinates from its own local repo.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("maven.modrinth:8BmcQJ2H:${geckolib_modrinth_version}")
    implementation fg.deobf("maven.modrinth:gedNE4y2:${playeranimator_modrinth_version}")
    // TaCZ is optional at runtime: the core only touches it through dev.holdfast.core.compat.tacz, guarded by ModList.
    compileOnly fg.deobf("maven.modrinth:SzzJttH8:${tacz_modrinth_version}")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
    // Rule tests are pure Java; keep Forge off their classpath ordering concerns.
    testLogging { events 'failed'; exceptionFormat 'full' }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties + [project: project] }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(['Specification-Title': mod_id, 'Specification-Vendor': mod_authors, 'Specification-Version': '1',
                    'Implementation-Title': project.name, 'Implementation-Version': project.jar.archiveVersion,
                    'Implementation-Vendor': mod_authors])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
