// Holdfast core mod: server-owned combat rules (docs/core_combat.md). Forge 1.20.1 MDK layout, ForgeGradle 6.
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        // Automated server checks (docs/core_combat.md): ./gradlew runGameTestServer
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

// The exported character assets are shared with the test harness.
sourceSets.main.resources { srcDir '../art/characters/export' }

repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    // Not exclusiveContent: ForgeGradle serves remapped copies of these coordinates from its own local repo.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("maven.modrinth:8BmcQJ2H:${geckolib_modrinth_version}")
    implementation fg.deobf("maven.modrinth:gedNE4y2:${playeranimator_modrinth_version}")
    // TaCZ is optional at runtime: the core only touches it through dev.holdfast.core.compat.tacz, guarded by ModList.
    compileOnly fg.deobf("maven.modrinth:SzzJttH8:${tacz_modrinth_version}")
    // Optional client presentation bridge; exact API inspected from this published file.
    compileOnly fg.deobf('curse.maven:extra-gore-937006:8608443')
    // Optional body renderer trial; 2.4.8 retains working PA offset support and needs no extra animation owner.
    compileOnly fg.deobf('maven.modrinth:H5XMjpHi:iwodXe68')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

// Opt-in isolated presentation smoke run. Probe code/dependencies are excluded from ordinary release builds.
if (project.hasProperty('presentationProbe') || project.hasProperty('presentationProbeServer')) {
    dependencies { runtimeOnly fg.deobf("maven.modrinth:SzzJttH8:${tacz_modrinth_version}") }
    if (project.hasProperty('presentationProbe')) {
        sourceSets.main.java.srcDir 'tools/probe'
        repositories { flatDir { dirs 'build/test-evidence/2026-10-18-dawn/probe-jars' } }
        dependencies {
            runtimeOnly fg.deobf('maven.modrinth:H5XMjpHi:iwodXe68')
            runtimeOnly fg.deobf('curse.maven:extra-gore-937006:8608443')
            runtimeOnly fg.deobf('probe.local:bookling:3.15')
            if (project.hasProperty('freshPresentationProbe')) {
                runtimeOnly fg.deobf('maven.modrinth:4I1XuqiY:mQR6L8Qe')
                runtimeOnly fg.deobf('maven.modrinth:BVzZfTc1:EAHEZRbp')
                runtimeOnly fg.deobf('maven.modrinth:entity-player-compat:3Yn7rcNT')
                runtimeOnly fg.deobf('maven.modrinth:emf-compat-core:O02HXwIg')
                runtimeOnly fg.deobf('maven.modrinth:emf-compat-tacz:bG7U0hqM')
            }
        }
        minecraft.runs.client {
            workingDirectory project.file('build/presentation-probe/client')
            property 'holdfast.probe', project.file(project.hasProperty('freshPresentationProbe')
                    ? 'build/test-evidence/2026-10-18-fresh/client-probe'
                    : project.hasProperty('bloodPresentationProbe') ? 'build/test-evidence/2026-10-18-blood/client-probe'
                    : 'build/test-evidence/2026-10-18-dawn/client-probe').absolutePath
            if (project.hasProperty('bloodPresentationProbe')) property 'holdfast.bloodProbe', 'true'
            args '--server', 'localhost', '--port', '25566', '--username', 'HoldfastProbe'
        }
    } else {
        minecraft.runs.server { workingDirectory project.file('build/presentation-probe/server') }
    }
}

// Opt-in isolated smoke runs for TaCZ gun packs (art/guns, -PgunPackProbe) and held core items such as GeckoLib
// iconic weapons (art/weapons, -PheldItemProbe). Probe code is excluded from ordinary release builds.
// Gun packs go in build/gun-probe/client/tacz first; screenshots land in build/test-evidence/<value>.
if (project.hasProperty('gunPackProbe') || project.hasProperty('heldItemProbe') || project.hasProperty('executionItemProbe')) {
    sourceSets.main.java.srcDir 'tools/gunprobe'
    dependencies { runtimeOnly fg.deobf("maven.modrinth:SzzJttH8:${tacz_modrinth_version}") }
    minecraft.runs.client {
        workingDirectory project.file('build/gun-probe/client')
        if (project.hasProperty('gunPackProbe'))
            property 'holdfast.gunProbe', project.file('build/test-evidence/' + project.property('gunPackProbe')).absolutePath
        if (project.hasProperty('heldItemProbe'))
            property 'holdfast.itemProbe', project.file('build/test-evidence/' + project.property('heldItemProbe')).absolutePath
        if (project.hasProperty('executionItemProbe'))
            property 'holdfast.executionItemProbe', project.file('build/test-evidence/' + project.property('executionItemProbe')).absolutePath
    }
}

test {
    useJUnitPlatform()
    // Rule tests are pure Java; keep Forge off their classpath ordering concerns.
    testLogging { events 'failed'; exceptionFormat 'full' }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties + [project: project] }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(['Specification-Title': mod_id, 'Specification-Vendor': mod_authors, 'Specification-Version': '1',
                    'Implementation-Title': project.name, 'Implementation-Version': project.jar.archiveVersion,
                    'Implementation-Vendor': mod_authors])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
